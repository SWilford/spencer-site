name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:scene
      - run: npm run test:music
      - run: npm run test:scrollbar
      - run: npm run test:showcases
      - name: Check native deployment imports
        run: node --experimental-strip-types --input-type=module -e "import './src/lib/hosted-music-data.ts'"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run check
